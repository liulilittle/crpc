# CI uses the repository's own one-click scripts unchanged (requirement 25).
# Nothing here re-implements a build step: every job is a checkout plus a call
# to scripts/build.* and scripts/test.* with documented flags only. If a job
# needs a new flag, the script gains it first.
#
# Coverage rationale
#   * Both optimiser settings on both platforms. A Release-only defect has
#     shipped twice (an arena overflow that only `-Walloc-size-larger-than=`
#     saw, and a use-after-free in `server::impl`'s member destruction order),
#     so Debug alone is not a gate.
#   * Both compilers on Linux. MSVC accepts things gcc rejects (a multi-char
#     constant made a tab comparison permanently false) and clang rejects
#     things gcc accepts.
#   * Every sanitizer, because requirement 26 makes them merge gates. They run
#     as one job with `--sanitizer all` so the build tree is shared per
#     sanitizer and the report parsing lives in one place (test.sh).
#
# The scripts default their build root to <repo>/.opencode/tmp/out, so the
# build and test steps of a job agree without passing a path.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux/${{ matrix.compiler }}/${{ matrix.config }}${{ matrix.shared && ' /shared' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, config: Debug }
          - { compiler: gcc, config: Release }
          - { compiler: clang, config: Debug }
          # A shared build is a different configuration of the same sources and
          # it is the only one that exercises the ELF export table. Without this
          # row, `scripts/export_gate.py` never reads libcrpc.so: test.sh runs it
          # only under --shared (see the export-gate block in test.sh).
          - { compiler: gcc, config: Debug, shared: true }
          - { compiler: clang, config: Debug, shared: true }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libssl-dev
          gcc --version | head -1
          clang --version | head -1
          cmake --version | head -1

      - name: Build
        run: >-
          bash scripts/build.sh
          --config ${{ matrix.config }}
          --compiler ${{ matrix.compiler }}
          --jobs "$(nproc)"
          ${{ matrix.shared && '--shared' || '' }}

      - name: Test
        run: >-
          bash scripts/test.sh
          --config ${{ matrix.config }}
          --compiler ${{ matrix.compiler }}
          ${{ matrix.shared && '--shared' || '' }}

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-${{ matrix.compiler }}-${{ matrix.config }}${{ matrix.shared && '-shared' || '' }}
          path: .opencode/tmp/out/logs
          if-no-files-found: ignore

  linux-sanitizers:
    name: linux/sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libssl-dev
          gcc --version | head -1

      # --sanitizer all makes test.sh build and run asan, ubsan and tsan in
      # separate build directories (they cannot share one binary). build.sh
      # itself takes a single sanitizer, so this one call does both halves.
      - name: Build and test (asan + ubsan + tsan)
        run: bash scripts/test.sh --config Debug --sanitizer all

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-sanitizers
          path: .opencode/tmp/out/logs
          if-no-files-found: ignore

  windows:
    name: windows/${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: Debug }
          - { config: Release }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          (Get-Command cl -ErrorAction SilentlyContinue) | Out-Null

      # The script locates vcvars through vswhere, so it does not need a
      # developer prompt.
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Config ${{ matrix.config }} -Arch x64 -Jobs $env:NUMBER_OF_PROCESSORS

      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1 -Config ${{ matrix.config }} -Arch x64

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ matrix.config }}
          path: .opencode/tmp/out/logs
          if-no-files-found: ignore

  # The static jobs link the object files directly, so they cannot see whether a
  # public symbol is actually exported. In this configuration `CRPC_API` becomes
  # __declspec(dllexport), and `crpc_test_shared_link` links as a consumer against the
  # import library: a public type or function that the headers declare but the library
  # does not export fails to link here, instead of in a user's program. The job runs
  # Debug only -- the export set does not depend on optimisation -- and keeps the whole
  # test suite, because some cases behave differently when the library is a DLL.
  shared:
    name: windows/shared
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1

      # test.ps1 -Shared also runs crpc_test_shared_link directly: it is the
      # consumer link gate, and a filtered ctest would skip it.
      - name: Build and test (shared)
        shell: pwsh
        run: ./scripts/test.ps1 -Config Debug -Arch x64 -Shared

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-shared
          path: .opencode/tmp/out/logs
          if-no-files-found: ignore

  # examples/ is off by default, and until this job existed no CI job ever set
  # CRPC_BUILD_EXAMPLES=ON: the quickstarts are consumers of the public API, so
  # one could stop compiling, or start exiting non-zero, and every job would
  # stay green. examples/CMakeLists.txt registers each one in CTest and claims
  # "a build proves it actually runs", so this job builds and runs them.
  #
  # It configures with CRPC_BUILD_TESTS=OFF on purpose (build.ps1 -NoTests).
  # enable_testing() used to be called only inside the CRPC_BUILD_TESTS branch,
  # so that exact combination registered zero tests while the unit-test jobs --
  # which all pass TESTS=ON -- stayed green. Testing only the TESTS=ON shape
  # would reproduce the blind spot, and --no-tests=error is what makes the
  # regression loud if it comes back.
  examples:
    name: windows/examples
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1

      # One call does both halves: test.ps1 resolves vcvars/cmake/ctest itself
      # (cmake is not guaranteed to be on PATH), configures with
      # CRPC_BUILD_TESTS=OFF, builds, then runs CTest with --no-tests=error and
      # a per-test timeout, plus the filtered crpc_example_ pass.
      - name: Build and run the examples
        shell: pwsh
        run: ./scripts/test.ps1 -Config Release -Arch x64 -Examples -NoTests

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-examples
          path: .opencode/tmp/out/logs
          if-no-files-found: ignore

  # bench/ is off by default and is never part of the pass/fail gate, so nothing
  # compiled it and its code could rot into something that does not build at all --
  # while bench/CMakeLists.txt claims it is built "so that benchmark code cannot
  # rot". This job makes that claim true: it compiles every benchmark and runs
  # none of them, because a shared runner cannot produce comparable numbers.
  bench-compile:
    name: windows/bench-compile
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1

      # --bench turns CRPC_BUILD_BENCH on; the build target list includes the
      # benchmark executables, so a target that no longer compiles fails here.
      - name: Build benchmarks
        shell: pwsh
        run: ./scripts/build.ps1 -Config Release -Arch x64 -Jobs $env:NUMBER_OF_PROCESSORS -Bench

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-bench-compile
          path: .opencode/tmp/out/logs
          if-no-files-found: ignore
